[pytest]
markers =
    smoke: fast, high-confidence checks of the core add/remove/save/discard flow
    functional: per-field add/remove/list behavior
    validation: input validation and boundary cases
    ui: visual/interaction behavior
    state: Save/Discard draft lifecycle
    regression: cross-field isolation and re-run checks
    a11y: accessibility checks
addopts = -ra --strict-markers
